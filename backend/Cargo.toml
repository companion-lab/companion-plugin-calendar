[package]
name = "calendar-backend"
version = "0.1.0"
description = "Calendar feature plugin backend for companion-tauri"
license = "MIT"
edition = "2021"

[lib]
name = "calendar_backend"
crate-type = ["cdylib"]

[dependencies]
companion-plugin-sdk = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
