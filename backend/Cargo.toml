[package]
name = "calendar-backend"
version = "0.7.0"
description = "Calendar feature plugin backend for companion-tauri"
authors = ["Companion Lab"]
license = "MIT"
edition = "2021"

[lib]
name = "calendar_backend"
crate-type = ["cdylib"]

[dependencies]
companion-plugin-sdk = "0.4"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite storage (bundled: SQLite compiled in, no system dependency).
rusqlite = { version = "0.32", features = ["bundled"] }
# Google Calendar sync: HTTPS client, OAuth loopback callback, keychain
# tokens (chrono-tz resolves IANA zone names in event start/end fields).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tiny_http = "0.12"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
chrono-tz = "0.9"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
strip = true
